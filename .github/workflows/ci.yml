name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dca-terminal-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Verify web project contract
        run: |
          test -f package.json
          test -f package-lock.json
          test -f Dockerfile

      - name: Install web dependencies
        run: npm ci

      - name: Audit production web dependencies
        run: npm audit --omit=dev

      - name: Run web lint when defined
        run: |
          if [ "$(npm pkg get scripts.lint)" != "null" ]; then
            npm run lint
          fi

      - name: Run web tests
        run: npm test -- --run

      - name: Build web application
        run: npm run build

  api:
    name: API checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Verify API project contract
        run: |
          test -f Dockerfile
          test -f gradlew
          test -f build.gradle || test -f build.gradle.kts

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run API tests and build
        run: ./gradlew test build --no-daemon

  api-postgres:
    name: API PostgreSQL 18.6 schema checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run PostgreSQL 18.6 Flyway and Hibernate validation
        run: ./gradlew postgresTest --no-daemon

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment files
        run: |
          test -f deploy/docker-compose.yml
          test -f deploy/Caddyfile
          test -f deploy/.env.example
          test -f deploy/scripts/backup-postgres.sh
          test -f deploy/scripts/restore-postgres.sh
          test -f deploy/systemd/dca-terminal-backup.service
          test -f deploy/systemd/dca-terminal-backup.timer

      - name: Create CI-only environment file
        run: |
          trap 'rm -f deploy/.env' EXIT
          cp deploy/.env.example deploy/.env
          docker compose --env-file deploy/.env -f deploy/docker-compose.yml config --quiet

      - name: Check shell scripts
        run: |
          bash -n deploy/scripts/backup-postgres.sh
          bash -n deploy/scripts/restore-postgres.sh

  repository:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check whitespace errors
        run: git diff --check
