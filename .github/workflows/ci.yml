name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dca-terminal-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Verify web project contract
        run: |
          test -f package.json
          test -f package-lock.json
          test -f Dockerfile

      - name: Install web dependencies
        run: npm ci

      - name: Audit production web dependencies
        run: npm audit --omit=dev

      - name: Run web lint when defined
        run: |
          if node -e "const p = require('./package.json'); process.exit(p.scripts?.lint ? 0 : 1)"; then
            npm run lint
          fi

      - name: Run web typecheck
        run: npm run typecheck

      - name: Run web tests
        run: npm test -- --run

      - name: Build web application
        run: npm run build

  api:
    name: API checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Verify API project contract
        run: |
          test -f Dockerfile
          test -f gradlew
          test -f build.gradle || test -f build.gradle.kts

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run API tests and build
        run: ./gradlew test build --no-daemon

  api-postgres:
    name: API PostgreSQL 18.6 schema checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run PostgreSQL 18.6 Flyway and Hibernate validation
        run: ./gradlew postgresTest --no-daemon

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment files
        run: |
          test -f deploy/docker-compose.yml
          test -f deploy/Caddyfile
          test -f deploy/.env.example
          test -f deploy/scripts/backup-postgres.sh
          test -f deploy/scripts/restore-postgres.sh
          test -f deploy/scripts/backup-restore-smoke.sh
          test -f deploy/scripts/smoke-deployment.sh
          test -f deploy/systemd/dca-terminal-backup.service
          test -f deploy/systemd/dca-terminal-backup.timer

      - name: Create CI-only environment file
        run: |
          trap 'rm -f deploy/.env' EXIT
          cp deploy/.env.example deploy/.env
          docker compose --env-file deploy/.env -f deploy/docker-compose.yml config --quiet

      - name: Check shell scripts
        run: |
          bash -n deploy/scripts/backup-postgres.sh
          bash -n deploy/scripts/restore-postgres.sh
          bash -n deploy/scripts/backup-restore-smoke.sh
          bash -n deploy/scripts/smoke-deployment.sh

  backup-restore:
    name: PostgreSQL backup and restore smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run PostgreSQL 18.6 dump and restore verification
        run: bash deploy/scripts/backup-restore-smoke.sh

  deployment-smoke:
    name: Caddy and API deployment smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DCA_SMOKE_USERNAME: smoke
      DCA_SMOKE_PASSWORD: sa08-ci-password
      DCA_SMOKE_EXPECT_SECURE_COOKIES: "1"
      DCA_SMOKE_INSECURE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start temporary HTTPS deployment and run smoke
        run: |
          env_file="$(mktemp)"
          compose_project="dca-sa08-deploy-${GITHUB_RUN_ID}"
          compose=(docker compose --env-file "$env_file" -f deploy/docker-compose.yml)
          cleanup() {
            local status="$?"
            set +e
            "${compose[@]}" down -v --remove-orphans >/dev/null 2>&1
            rm -f -- "$env_file"
            exit "$status"
          }
          trap cleanup EXIT

          cat >"$env_file" <<ENV
          COMPOSE_PROJECT_NAME=$compose_project
          APP_DOMAIN=localhost
          CADDY_EMAIL=smoke@example.invalid
          POSTGRES_IMAGE=postgres:18.6-alpine
          CADDY_IMAGE=caddy:2-alpine
          POSTGRES_DB=dca_terminal
          POSTGRES_USER=dca_terminal
          POSTGRES_PASSWORD=sa08-temporary-postgres-password
          APP_USERNAME=smoke
          APP_PASSWORD_HASH=\$\$2b\$\$10\$\$N9qo8uLOickgx2ZMRZoMyeyWZ98aNASLjNbtXyQqlJDPam8SBgRkC
          APP_SECURITY_ENABLED=true
          APP_COOKIE_SECURE=true
          APP_LOGIN_MAX_ATTEMPTS=5
          APP_LOGIN_THROTTLE_WINDOW_SECONDS=900
          SPRING_PROFILES_ACTIVE=prod
          FLYWAY_ENABLED=true
          MARKET_SYNC_ENABLED=false
          VITE_API_BASE_URL=/api/v1
          VITE_APP_MODE=live
          MARKET_DATA_PRIMARY_PROVIDER=YAHOO
          MARKET_DATA_FALLBACK_PROVIDER=TWELVE_DATA
          YAHOO_PROXY_URL=
          TWELVE_DATA_API_KEY=
          ALPHA_VANTAGE_API_KEY=
          ENV

          "${compose[@]}" config --quiet
          "${compose[@]}" up -d --build

          for attempt in $(seq 1 90); do
            if curl --silent --show-error --insecure --fail --max-time 5 \
                https://localhost/api/health >/dev/null; then
              break
            fi
            if [[ "$attempt" == 90 ]]; then
              printf 'Temporary deployment did not become healthy.\n' >&2
              exit 1
            fi
            sleep 2
          done

          DCA_SMOKE_BASE_URL=https://localhost bash deploy/scripts/smoke-deployment.sh

  repository:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check whitespace errors
        run: git diff --check
