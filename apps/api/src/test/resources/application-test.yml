spring:
  datasource:
    url: jdbc:h2:mem:dca;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
  cache:
    type: simple
  session:
    jdbc:
      initialize-schema: embedded

dca:
  scheduler:
    enabled: false
  security:
    enabled: false
